<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamFlix</title>
  <meta name="description" content="StreamFlix is an open-source Android app for discovering movies, watching trailers and keeping a personal list.">
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; color: #1b1b1f; text-align: center; }
    img { width: 112px; height: 112px; border-radius: 24px; }
    h1 { margin: 1rem 0 .25rem; line-height: 1.25; }
    p { margin: .75rem 0; }
    nav { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; margin: 1.75rem 0; }
    nav a { padding: .55rem 1.1rem; border-radius: 999px; border: 1px solid #c9c9d0; text-decoration: none; color: inherit; }
    nav a:first-child { background: #e50914; border-color: #e50914; color: #fff; }
    small { color: #5f5f66; }
    @media (prefers-color-scheme: dark) {
      body { background: #121214; color: #e6e6ea; }
      nav a { border-color: #44444c; }
      nav a:first-child { background: #e50914; border-color: #e50914; color: #fff; }
      a { color: #ff8a80; }
      small { color: #a0a0a8; }
    }
  </style>
</head>
<body>
  <img src="images/logo.png" alt="StreamFlix logo" width="112" height="112">
  <h1>StreamFlix</h1>
  <p>An open-source Android app for discovering movies, watching official trailers and keeping a personal list for each profile.</p>

  <nav>
    <a href="privacy.html">Privacy policy</a>
    <a href="https://github.com/Maximum21/StreamFlix">Source code</a>
  </nav>

  <p><small>This product uses the TMDB API but is not endorsed or certified by TMDB.</small></p>
</body>
</html>
