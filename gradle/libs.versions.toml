[versions]
# Android SDK Versions
compileSdk = "36"
minSdk = "24"
targetSdk = "36"

agp = "8.9.1"
kotlin = "2.0.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
baselineProfile = "1.3.4"
benchmark = "1.3.4"
uiautomator = "2.3.0"
profileInstaller = "1.4.1"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2025.11.00"
appcompat = "1.7.1"
material = "1.13.0"
room = "2.7.2"
composeNavigation = "2.9.6"
datastore = "1.1.7"

# Media

# Firebase
firebaseBom = "34.0.0"
