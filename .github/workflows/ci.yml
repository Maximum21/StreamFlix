name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Fork pull requests do not receive secrets, so fall back to a placeholder
      # that lets the Google Services plugin run without real Firebase values.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          else
            cp .github/ci/google-services.placeholder.json app/google-services.json
          fi

      - name: Static analysis
        run: ./gradlew --continue checkModuleGraph detekt ktlintCheck lintDebug

      - name: Unit tests and coverage
        run: ./gradlew --continue testDebugUnitTest koverXmlReport koverVerify :domain:koverVerify :data:koverVerify

      - name: Assemble debug
        run: ./gradlew assembleDebug

      # R8 only runs on release builds, so a missing keep rule would otherwise surface on a device.
      # The release build needs the TMDB token, which fork pull requests do not receive.
      - name: Assemble release (R8)
        if: env.TMDB_ACCESS_TOKEN != ''
        run: ./gradlew :app:assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/ktlint/
            **/build/reports/lint-results-debug.html
            build/reports/kover/

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The whole history is scanned every time. The gitleaks action scans "the parent of the first
      # pushed commit up to the last", which cannot be resolved when a push contains a root commit.
      - name: Scan the full history for secrets
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "${BASE}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks detect --source . --redact --exit-code 2 --no-banner

  firestore-rules:
    name: firestore-rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
