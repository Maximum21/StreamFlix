name: Release

# A release is cut by merging a pull request from a branch named release/X.Y.Z into main (or
# master), where the latest commit on the release branch has the message "release: X.Y.Z" with the
# same version. Nothing else starts it, and a mismatch fails before anything is built.
#
# The merged code is built into a signed bundle by one job and published by another, so the
# distribution credentials never reach the build. Firebase App Distribution and the Play Console
# internal track are used only when their secrets exist. TMDB_ACCESS_TOKEN is always required, the
# release build fails without it; without the signing secrets the run attaches an unsigned bundle, and
# nothing is published until the publishing secrets are added (the README lists them).
on:
  pull_request:
    types: [closed]
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bundle:
    name: bundle
    # Only a merged pull request from a release/* branch of this repository (forks get no secrets)
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - name: Validate the release branch and its latest commit message
        env:
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          MESSAGE="$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.message)"
          FIRST_LINE="$(printf '%s' "$MESSAGE" | head -n 1)"
          if [[ ! "$BRANCH" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Branch '$BRANCH' must be named release/X.Y.Z"; exit 1
          fi
          BRANCH_VERSION="${BASH_REMATCH[1]}"
          if [[ ! "$FIRST_LINE" =~ ^release:\ ?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Latest commit message '$FIRST_LINE' must be 'release: X.Y.Z'"; exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$BRANCH_VERSION" ]]; then
            echo "::error::Branch version $BRANCH_VERSION and commit version ${BASH_REMATCH[1]} differ"; exit 1
          fi
          echo "VERSION_NAME=$BRANCH_VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          else
            cp .github/ci/google-services.placeholder.json app/google-services.json
          fi

      - name: Decode the signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Derive the version code
        run: echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build the release bundle
        run: ./gradlew :app:bundleRelease

      - name: Upload the bundle and the R8 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          retention-days: 7
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

  # Publishing is a separate job so that the distribution credentials never reach the Gradle build,
  # and it runs in the "release" environment, where required reviewers can be configured
  # (Settings > Environments) to approve each release before anything is published.
  publish:
    name: publish
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      # Third-party actions that receive credentials are pinned to a commit, not to a movable tag
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: release-bundle

      - name: Distribute to testers
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: release-bundle/bundle/release/app-release.aab

      - name: Publish to the Play internal track
        if: env.PLAY_SERVICE_ACCOUNT != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.asadraza.streamflix
          releaseFiles: release-bundle/bundle/release/app-release.aab
          track: internal
          status: draft
          mappingFile: release-bundle/mapping/release/mapping.txt
